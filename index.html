<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Life RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .auth-container { background: #2c3e50; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .auth-container h2 { margin-bottom: 20px; color: #f1c40f; }
        .auth-container input, .auth-container select, .auth-container button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; }
        .auth-container button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; }
        .toggle-btn { background: transparent !important; color: #bdc3c7 !important; text-decoration: underline; cursor: pointer; }

        #game-screen { display: none; flex-direction: column; align-items: center; }
        #ui-bar { background: #34495e; width: 800px; padding: 15px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
        #game-canvas { background-color: #7dcf5a; border: 4px solid #2c3e50; }
        
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c3e50; border: 3px solid #f1c40f; padding: 20px; border-radius: 10px; text-align: center; min-width: 300px; z-index: 10; }
        .modal button { padding: 8px 15px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; background: #e67e22; color: white; font-weight: bold; }
    </style>

    <!-- Firebase CDN Libraries para sa Notepad/HTML (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- LOGIN / REGISTER SCREEN -->
    <div id="auth-screen" class="auth-container">
        <h2 id="auth-title">Barangay Login</h2>
        <input type="email" id="email" placeholder="Email (e.g. juan@gmail.com)">
        <input type="password" id="password" placeholder="Password">
        
        <div id="register-fields" style="display: none;">
            <input type="text" id="username" placeholder="Username (In-game Name)">
            <select id="gender">
                <option value="Boy">Boy (Lalaki)</option>
                <option value="Girl">Girl (Babae)</option>
            </select>
        </div>

        <button id="auth-btn" onclick="handleAuth()">LOGIN</button>
        <button class="toggle-btn" onclick="toggleAuthMode()">Wala pang account? Register</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="ui-bar">
            <div><strong>Player:</strong> <span id="display-name">-</span> (<span id="display-gender">-</span>)</div>
            <div><strong>Pera:</strong> ₱<span id="display-money">500</span></div>
            <button onclick="logout()" style="background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Logout</button>
        </div>
        <canvas id="game-canvas" width="800" height="500"></canvas>
    </div>

    <!-- GAMBLING MODAL -->
    <div id="gambling-modal" class="modal">
        <h2>Sugalan sa Kanto (Coin Flip)</h2>
        <p>Pusta: ₱100 (50/50 Tsansa Manalo ng ₱200)</p><br>
        <button onclick="playCoinFlip()">Mag-Flip ng Barya</button><br><br>
        <button onclick="closeModals()" style="background: #e74c3c;">Isara</button>
    </div>

    <script>
        // ANG IYONG FIREBASE CONFIG (Inayos na para sa HTML/Notepad Format)
        const firebaseConfig = {
            apiKey: "AIzaSyBvO_hpTfhHRf-J2Qy7yLgcdEZ7V5vomb4",
            authDomain: "barangaynileenz-rpg.firebaseapp.com",
            projectId: "barangaynileenz-rpg",
            storageBucket: "barangaynileenz-rpg.firebasestorage.app",
            messagingSenderId: "327162460431",
            appId: "1:327162460431:web:e16c66026e4df0ea5c667a",
            measurementId: "G-PLJCTGHFHF"
        };

        // Initialize Firebase System
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegisterMode = false;
        let currentUserUid = null;
        let currentPlayerData = null;
        let otherPlayers = {};

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 100, y: 100, size: 30, speed: 5 };
        const structures = [
            { name: "Aking Bahay", x: 50, y: 50, w: 80, h: 80, color: "#e67e22" },
            { name: "Sugalan", x: 650, y: 50, w: 80, h: 80, color: "#f1c40f", type: "gambling" }
        ];

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "Gumawa ng Account" : "Barangay Login";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "REGISTER" : "LOGIN";
            document.getElementById('register-fields').style.display = isRegisterMode ? "block" : "none";
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!email || !pass) return alert("Paki-lagay ang Email at Password!");

            if (isRegisterMode) {
                const username = document.getElementById('username').value.trim();
                const gender = document.getElementById('gender').value;
                if (!username) return alert("Kailangan ang Username!");

                try {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection('users').doc(res.user.uid).set({
                        username: username,
                        gender: gender,
                        money: 500,
                        x: 100,
                        y: 100
                    });
                    alert("Account Created Successfully!");
                } catch (err) { alert(err.message); }
            } else {
                try {
                    await auth.signInWithEmailAndPassword(email, pass);
                } catch (err) { alert(err.message); }
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                initGame();
            }
        });

        function initGame() {
            // Realtime Sync ng Sariling Data
            db.collection('users').doc(currentUserUid).onSnapshot(doc => {
                currentPlayerData = doc.data();
                document.getElementById('display-name').innerText = currentPlayerData.username;
                document.getElementById('display-gender').innerText = currentPlayerData.gender;
                document.getElementById('display-money').innerText = currentPlayerData.money;
            });

            // Realtime Sync para Makita ang ibang Multiplayer Players
            db.collection('users').onSnapshot(snapshot => {
                otherPlayers = {};
                snapshot.forEach(doc => {
                    if (doc.id !== currentUserUid) {
                        otherPlayers[doc.id] = doc.data();
                    }
                });
            });

            gameLoop();
        }

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function updatePlayer() {
            let moved = false;
            if (keys['w'] || keys['ArrowUp']) { if (player.y > 0) player.y -= player.speed; moved = true; }
            if (keys['s'] || keys['ArrowDown']) { if (player.y < canvas.height - player.size) player.y += player.speed; moved = true; }
            if (keys['a'] || keys['ArrowLeft']) { if (player.x > 0) player.x -= player.speed; moved = true; }
            if (keys['d'] || keys['ArrowRight']) { if (player.x < canvas.width - player.size) player.x += player.speed; moved = true; }

            if (moved && currentUserUid) {
                db.collection('users').doc(currentUserUid).update({
                    x: player.x,
                    y: player.y
                });
            }

            structures.forEach(s => {
                if (player.x < s.x + s.w && player.x + player.size > s.x &&
                    player.y < s.y + s.h && player.y + player.size > s.y) {
                    if (s.type === 'gambling') document.getElementById('gambling-modal').style.display = 'block';
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Structures
            structures.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.fillStyle = "white";
                ctx.fillText(s.name, s.x + 5, s.y - 5);
            });

            // Draw Other Players (Multiplayer)
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.fillStyle = p.gender === 'Boy' ? '#e74c3c' : '#fd79a8';
                ctx.fillRect(p.x, p.y, player.size, player.size);
                ctx.fillStyle = "white";
                ctx.fillText(p.username, p.x - 5, p.y - 5);
            }

            // Draw Own Player
            if (currentPlayerData) {
                ctx.fillStyle = currentPlayerData.gender === 'Boy' ? '#3498db' : '#e84393';
                ctx.fillRect(player.x, player.y, player.size, player.size);
                ctx.fillStyle = "white";
                ctx.fillText(currentPlayerData.username, player.x - 5, player.y - 5);
            }
        }

        function gameLoop() {
            updatePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function closeModals() {
            document.getElementById('gambling-modal').style.display = 'none';
        }

        function playCoinFlip() {
            if (currentPlayerData.money < 100) return alert("Kulang ang pera mo!");
            let win = Math.random() < 0.5;
            let newMoney = win ? currentPlayerData.money + 100 : currentPlayerData.money - 100;
            
            db.collection('users').doc(currentUserUid).update({ money: newMoney });
            alert(win ? "NANALO KA NG ₱100!" : "NATALO KA NG ₱100!");
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }
    </script>
</body>
</html>
