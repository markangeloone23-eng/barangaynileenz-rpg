<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay 3D Horror RPG</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: white; overflow: hidden; user-select: none; }
        
        /* AUTH SCREEN */
        .auth-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); padding: 30px; border-radius: 12px; width: 380px; text-align: center; border: 2px solid #9b2c2c; box-shadow: 0 0 30px rgba(155, 44, 44, 0.5); z-index: 100; }
        .auth-container h2 { margin-bottom: 15px; color: #e53e3e; letter-spacing: 2px; }
        .auth-container input, .auth-container button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: none; }
        .auth-container input { background: #1f2937; color: white; border: 1px solid #374151; }
        .auth-container button { background: #9b2c2c; color: white; font-weight: bold; cursor: pointer; }
        .toggle-btn { background: transparent !important; color: #9ca3af !important; text-decoration: underline; cursor: pointer; }

        /* STORYLINE & CHARACTER SELECTION */
        #story-screen { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); padding: 30px; border-radius: 12px; width: 550px; text-align: center; border: 2px solid #9b2c2c; z-index: 100; }
        .story-text { font-size: 15px; line-height: 1.6; color: #cbd5e1; margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border-left: 5px solid #e53e3e; text-align: left; }
        .char-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .char-card { background: #1e293b; border: 2px solid #475569; border-radius: 10px; padding: 15px; cursor: pointer; width: 160px; transition: 0.3s; }
        .char-card.selected { border-color: #e53e3e; background: #0f172a; box-shadow: 0 0 15px #e53e3e; }
        .char-card img { width: 80px; height: 80px; object-fit: contain; }
        .char-card p { margin-top: 10px; font-weight: bold; font-size: 14px; color: #e53e3e; }
        .start-btn { background: #9b2c2c; color: white; font-weight: bold; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }

        /* UI OVERLAY */
        #ui-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; padding: 15px 25px; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        #ui-layer button { pointer-events: auto; }
        #crosshair { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.4); font-size: 20px; pointer-events: none; z-index: 10; }
        #click-prompt { display: none; position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; border: 1px solid #e53e3e; pointer-events: none; z-index: 10; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Three.js (3D Engine) & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen" class="auth-container">
        <h2 id="auth-title">BARANGAY 3D HORROR</h2>
        <input type="email" id="email" placeholder="Email (e.g. juan@gmail.com)">
        <input type="password" id="password" placeholder="Password">
        
        <div id="register-fields" style="display: none;">
            <input type="text" id="username" placeholder="Username (In-game Name)">
        </div>

        <button id="auth-btn" onclick="handleAuth()">LOGIN</button>
        <button class="toggle-btn" onclick="toggleAuthMode()">Wala pang account? Register</button>
    </div>

    <!-- 2. STORYLINE SCREEN -->
    <div id="story-screen">
        <h2 style="color: #e53e3e; margin-bottom: 15px;">Madilim na Gabi sa Barangay</h2>
        <div class="story-text">
            <strong>MISTERIOSONG BOSES:</strong> "Naglalakad ka sa madilim at lumang kalsada ng barangay... Hawak mo ang iyong lumang flashlight. Sino ka nga ulit?"
        </div>

        <div class="char-container">
            <div class="char-card selected" id="card-boy" onclick="selectGender('Boy')">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="Boy">
                <p>Boy (Lalaki)</p>
            </div>
            <div class="char-card" id="card-girl" onclick="selectGender('Girl')">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140047.png" alt="Girl">
                <p>Girl (Babae)</p>
            </div>
        </div>

        <button class="start-btn" onclick="confirmCharacterSelection()">PASUKIN ANG DILIM</button>
    </div>

    <!-- 3. UI OVERLAY -->
    <div id="ui-layer">
        <div><strong>Player:</strong> <span id="display-name">-</span> | <strong>Pera:</strong> ₱<span id="display-money">500</span></div>
        <button onclick="logout()" style="background: #9b2c2c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Logout</button>
    </div>
    <div id="crosshair">+</div>
    <div id="click-prompt">I-click ang Screen para Igalaw ang Camera</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvO_hpTfhHRf-J2Qy7yLgcdEZ7V5vomb4",
            authDomain: "barangaynileenz-rpg.firebaseapp.com",
            projectId: "barangaynileenz-rpg",
            storageBucket: "barangaynileenz-rpg.firebasestorage.app",
            messagingSenderId: "327162460431",
            appId: "1:327162460431:web:e16c66026e4df0ea5c667a",
            measurementId: "G-PLJCTGHFHF"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegisterMode = false, selectedGender = "Boy", currentUserUid = null, currentPlayerData = null;
        let otherPlayers = {}, otherPlayerMeshes = {};

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "Gumawa ng Account" : "BARANGAY 3D HORROR";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "REGISTER" : "LOGIN";
            document.getElementById('register-fields').style.display = isRegisterMode ? "block" : "none";
        }

        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('card-boy').classList.toggle('selected', gender === 'Boy');
            document.getElementById('card-girl').classList.toggle('selected', gender === 'Girl');
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!email || !pass) return alert("Paki-lagay ang Email at Password!");

            if (isRegisterMode) {
                const username = document.getElementById('username').value.trim();
                if (!username) return alert("Kailangan ang Username!");
                try {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection('users').doc(res.user.uid).set({
                        username: username, gender: "", money: 500, x: 0, z: 0, rotY: 0
                    });
                } catch (err) { alert(err.message); }
            } else {
                try { await auth.signInWithEmailAndPassword(email, pass); } catch (err) { alert(err.message); }
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                db.collection('users').doc(currentUserUid).get().then(doc => {
                    const data = doc.data();
                    if (data && data.gender) start3DGame();
                    else document.getElementById('story-screen').style.display = 'block';
                });
            }
        });

        async function confirmCharacterSelection() {
            await db.collection('users').doc(currentUserUid).update({ gender: selectedGender });
            document.getElementById('story-screen').style.display = 'none';
            start3DGame();
        }

        // --- THREE.JS 3D ENGINE & CONTROLS ---
        let scene, camera, renderer, flashlight;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let yaw = 0, pitch = 0;
        let isPointerLocked = false;

        function start3DGame() {
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('click-prompt').style.display = 'block';

            // 1. Setup Scene, Camera & Fog (Horror Atmosphere)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.FogExp2(0x020202, 0.08); // Dark fog

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 0); // Eye-level height

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Flashlight Effect (SpotLight) Attached to Camera
            flashlight = new THREE.SpotLight(0xfff5cc, 3, 25, Math.PI / 6, 0.5, 1);
            flashlight.position.set(0, 0, 0);
            camera.add(flashlight);
            flashlight.target = camera;
            scene.add(camera);

            // Low Ambient Light for eerie shadows
            const ambient = new THREE.AmbientLight(0x0a0a1a);
            scene.add(ambient);

            // 3. Build 3D World (Ground & Street Walls)
            buildWorld();

            // 4. Mouse Controls (Pointer Lock)
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === document.body);
                document.getElementById('click-prompt').style.display = isPointerLocked ? 'none' : 'block';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch)); // Limit up/down tilt

                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            });

            // Keyboard Controls
            window.addEventListener('keydown', (e) => onKey(e.code, true));
            window.addEventListener('keyup', (e) => onKey(e.code, false));

            // Firebase Real-time Player Data Sync
            db.collection('users').doc(currentUserUid).onSnapshot(doc => {
                currentPlayerData = doc.data();
                document.getElementById('display-name').innerText = currentPlayerData.username;
                document.getElementById('display-money').innerText = currentPlayerData.money;
            });

            db.collection('users').onSnapshot(snapshot => {
                snapshot.forEach(doc => {
                    if (doc.id !== currentUserUid) {
                        const data = doc.data();
                        updateOtherPlayer3D(doc.id, data);
                    }
                });
            });

            animate();
        }

        function onKey(code, state) {
            if (code === 'KeyW' || code === 'ArrowUp') moveForward = state;
            if (code === 'KeyS' || code === 'ArrowDown') moveBackward = state;
            if (code === 'KeyA' || code === 'ArrowLeft') moveLeft = state;
            if (code === 'KeyD' || code === 'ArrowRight') moveRight = state;
        }

        function buildWorld() {
            // Ground (Road Texture/Color)
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 3D Barangay Walls / Houses Placeholder
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            
            for (let i = -30; i <= 30; i += 12) {
                if (i === 0) continue;
                // Left & Right Houses along the street
                createHouse(i, 2.5, -15, wallMat);
                createHouse(i, 2.5, 15, wallMat);
            }
        }

        function createHouse(x, y, z, mat) {
            const houseGeo = new THREE.BoxGeometry(8, 5, 8);
            const house = new THREE.Mesh(houseGeo, mat);
            house.position.set(x, y, z);
            scene.add(house);
        }

        function updateOtherPlayer3D(id, data) {
            if (!data.x && data.x !== 0) return;
            if (!otherPlayerMeshes[id]) {
                // 3D Silhouette Placeholder for Other Players
                const geo = new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16);
                const mat = new THREE.MeshStandardMaterial({ color: data.gender === 'Boy' ? 0x3b82f6 : 0xec4899 });
                const mesh = new THREE.Mesh(geo, mat);
                scene.add(mesh);
                otherPlayerMeshes[id] = mesh;
            }
            otherPlayerMeshes[id].position.set(data.x, 0.9, data.z);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (isPointerLocked) {
                const speed = 4.5 * delta;
                const dir = new THREE.Vector3();

                if (moveForward) dir.z -= 1;
                if (moveBackward) dir.z += 1;
                if (moveLeft) dir.x -= 1;
                if (moveRight) dir.x += 1;

                dir.normalize();
                dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw); // Move relative to camera direction

                camera.position.addScaledVector(dir, speed);

                // Send 3D Positions to Firebase
                if (currentUserUid && (moveForward || moveBackward || moveLeft || moveRight)) {
                    db.collection('users').doc(currentUserUid).update({
                        x: camera.position.x,
                        z: camera.position.z,
                        rotY: yaw
                    });
                }
            }

            renderer.render(scene, camera);
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
